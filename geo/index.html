<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>31.1650°N 121.4050°E — Shanghai / 上海</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --ink:#e6edf3; --dim:#8b949e; --acc:#3fb950; --panel:rgba(13,17,23,.86); --line:#28323f; }
  html, body { margin:0; height:100%; background:#0d1117; color:var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #map { position:absolute; inset:0; }
  .hud { position:absolute; z-index:900; left:14px; top:14px; padding:11px 13px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    backdrop-filter:blur(6px); max-width:260px; pointer-events:none; }
  .hud h1 { margin:0 0 5px; font-size:13.5px; letter-spacing:.03em; }
  .hud p  { margin:1px 0; color:var(--dim); font-size:11px; }
  .hud b  { color:var(--acc); font-weight:600; }
  .readout { position:absolute; z-index:900; right:14px; top:64px; padding:7px 10px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--dim); font-size:11px; }
  .readout b { color:var(--acc); }
  .tools { position:absolute; z-index:900; left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:6px; }
  .tools button { background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font:inherit; font-size:11.5px; cursor:pointer; white-space:nowrap; }
  .tools button:hover { border-color:var(--acc); color:var(--acc); }
  .tools button.on { border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset; }
  .leaflet-container { background:#0d1117; }
  .leaflet-control-attribution { background:rgba(13,17,23,.72)!important; color:#6e7681!important; }
  .leaflet-control-attribution a { color:#8b949e!important; }
  .leaflet-bar a { background:#11161d; color:#c9d1d9; border-color:var(--line); }
  .leaflet-bar a:hover { background:#1b232c; }
  .leaflet-control-layers { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
</style>
</head>
<body>
<div id="map"></div>

<div class="hud">
  <h1>31.1650°N 121.4050°E</h1>
  <p>上海 · 徐汇 · 冲积平原 ALT ≈ 4 m</p>
  <p>投影 Projection · Web Mercator EPSG:3857</p>
</div>

<div class="readout" id="readout">经纬度：移动鼠标 / move cursor</div>

<div class="tools">
  <button id="btn-graticule" class="on">经纬网 Grid</button>
  <button id="btn-measure">测距 Measure</button>
  <button id="btn-home">回到徐汇 Home</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const HOME = [31.1650, 121.4050];
const ACC = '#3fb950';

const map = L.map('map', { zoomControl: false, worldCopyJump: true }).setView(HOME, 12);
L.control.zoom({ position: 'bottomleft' }).addTo(map);

// basemaps reachable from mainland China, no key needed
const streets = L.tileLayer(
  'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  { maxZoom: 18, subdomains: '1234', attribution: '&copy; 高德地图 Amap' });
const imagery = L.tileLayer(
  'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
  { maxZoom: 18, subdomains: '1234', attribution: '&copy; 高德地图 Amap' });
const terrain = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 19, attribution: 'Tiles &copy; Esri' });
streets.addTo(map);
L.control.layers({ '街道 Streets': streets, '卫星 Satellite': imagery, '地形 Terrain': terrain },
  null, { position: 'topright' }).addTo(map);
L.control.scale({ imperial: false, position: 'bottomright' }).addTo(map);

// ---- graticule -------------------------------------------------------
const gridLayer = L.layerGroup().addTo(map);
function drawGraticule() {
  gridLayer.clearLayers();
  const b = map.getBounds();
  const z = map.getZoom();
  const step = z >= 15 ? 0.002 : z >= 13 ? 0.01 : z >= 11 ? 0.05 : 0.25;
  const style = { color: '#0e7a38', weight: 1, opacity: 0.45, dashArray: '3 4', interactive: false };
  for (let lon = Math.floor(b.getWest() / step) * step; lon <= b.getEast(); lon += step) {
    L.polyline([[b.getSouth(), lon], [b.getNorth(), lon]], style).addTo(gridLayer);
  }
  for (let lat = Math.floor(b.getSouth() / step) * step; lat <= b.getNorth(); lat += step) {
    L.polyline([[lat, b.getWest()], [lat, b.getEast()]], style).addTo(gridLayer);
  }
}
map.on('moveend zoomend', drawGraticule);
drawGraticule();

// ---- site marker -----------------------------------------------------
L.circle(HOME, { radius: 3000, color: '#0e7a38', weight: 1.5, fillColor: ACC, fillOpacity: 0.1 }).addTo(map);
L.circleMarker(HOME, { radius: 8, color: '#0b3d1f', weight: 3, fillColor: ACC, fillOpacity: 1 }).addTo(map)
  .bindPopup('<b>上海 · 徐汇</b><br>31.1650°N 121.4050°E<br>' +
             '<span style="color:#8b949e">北亚热带 · 年均温 17–18 °C · 年降水 ≈ 1200 mm</span>');
L.circleMarker(HOME, { radius: 18, color: ACC, weight: 2, fill: false, opacity: 0.9 }).addTo(map);
L.marker([31.2304, 121.4737], { opacity: 0.85 }).addTo(map).bindTooltip('上海中心城 · city centre');
L.marker(HOME, { opacity: 0 }).addTo(map)
  .bindTooltip('徐汇 Xuhui · 31.1650°N', { permanent: true, direction: 'right', offset: [9, 0], className: 'm' })
  .openTooltip();

// ---- measure ---------------------------------------------------------
let measuring = false, pts = [];
const measureLayer = L.layerGroup().addTo(map);
const btnMeasure = document.getElementById('btn-measure');
btnMeasure.onclick = () => {
  measuring = !measuring;
  btnMeasure.classList.toggle('on', measuring);
  if (!measuring) { pts = []; measureLayer.clearLayers(); }
  map.getContainer().style.cursor = measuring ? 'crosshair' : '';
};
function haversine(a, b) {
  const R = 6371.0088, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
map.on('click', e => {
  if (!measuring) return;
  const p = [e.latlng.lat, e.latlng.lng];
  pts.push(p);
  L.circleMarker(p, { radius: 4, color: '#fff', weight: 1.5, fillColor: ACC, fillOpacity: 1 }).addTo(measureLayer);
  if (pts.length > 1) {
    L.polyline(pts.slice(-2), { color: ACC, weight: 2 }).addTo(measureLayer);
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += haversine(pts[i - 1], pts[i]);
    L.marker(p, { opacity: 0 }).addTo(measureLayer)
      .bindTooltip(haversine(pts[pts.length - 2], p).toFixed(2) + ' km ／ 累计 ' + total.toFixed(2) + ' km',
                   { permanent: true, direction: 'top', className: 'm' }).openTooltip();
  }
});

// ---- readout ---------------------------------------------------------
const readout = document.getElementById('readout');
map.on('mousemove', e => {
  readout.innerHTML = '<b>' + e.latlng.lat.toFixed(5) + '°N, ' + e.latlng.lng.toFixed(5) + '°E</b>';
});

document.getElementById('btn-graticule').onclick = function () {
  this.classList.toggle('on');
  if (map.hasLayer(gridLayer)) { map.removeLayer(gridLayer); } else { map.addLayer(gridLayer); drawGraticule(); }
};
document.getElementById('btn-home').onclick = () => map.setView(HOME, 13);
</script>
</body>
</html>
