<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-label="Satellite link panel: 31.1650N 121.4050E, Xuhui, Shanghai">
  <defs>
    <pattern id="g-light" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0 H0 V18" fill="none" stroke="#e4eaf0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="190" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <rect x="0.5" y="0.5" width="719" height="189" rx="10" fill="none" stroke="#d1d9e0"/>
  <rect x="1" y="1" width="718" height="188" rx="10" fill="url(#g-light)" opacity="0.55"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="18" y="26" font-size="10.5" letter-spacing="1.6" fill="#8b949e">SAT-LINK / TELEMETRY</text>
    <text x="18" y="56" font-size="13" fill="#59636e">LAT <tspan fill="#3ba55d">31.1650</tspan>° N</text>
    <text x="18" y="78" font-size="13" fill="#59636e">LON <tspan fill="#3ba55d">121.4050</tspan>° E</text>
    <text x="18" y="104" font-size="12" fill="#59636e">TARGET <tspan fill="#3ba55d">XUHUI · SHANGHAI</tspan></text>
    <text x="18" y="126" font-size="11" fill="#8b949e">STATUS <tspan fill="#3ba55d">Crunching spatial data…</tspan></text>
    <text x="18" y="152" font-size="10" fill="#8b949e">EPSG:4326 · WGS 84 · ALT 4 m</text>
  </g>

  <g stroke="#3ba55d" fill="none" stroke-linecap="round">
    <path d="M300,104 L312,100 L324,106 L336,96 L348,108 L360,99 L372,105 L384,95 L396,107 L408,101 L420,104"
          stroke-width="1.4" opacity="0.75">
      <animate attributeName="opacity" values="0.75;0.3;0.75" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M300,116 L420,116" stroke-width="1" stroke-dasharray="2 4" opacity="0.35"/>
    <text x="300" y="134" font-family="ui-monospace, monospace" font-size="9.5" fill="#8b949e" stroke="none">SIGNAL · 1.696 GHz · LOCKED</text>
  </g>

  <g transform="translate(560,95)">
    <circle r="46" fill="none" stroke="#d1d9e0" stroke-dasharray="2 5"/>
    <circle r="30" fill="none" stroke="#e4eaf0" stroke-width="6"/>
    <circle r="30" fill="none" stroke="#3ba55d" stroke-width="1.4" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle r="8" fill="none" stroke="#3ba55d" stroke-width="2">
      <animate attributeName="r" values="8;44" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="none" stroke="#3ba55d" stroke-width="2">
      <animate attributeName="r" values="8;44" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <circle r="5" fill="#3ba55d"/>
    <circle r="5" fill="#3ba55d" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <path d="M-62,58 L-14,14" stroke="#3ba55d" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  </g>
</svg>
